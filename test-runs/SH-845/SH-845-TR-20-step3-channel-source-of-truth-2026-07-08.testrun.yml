notes: '## Solution understood

  SH-845 implements the Discount Authoring Wizard UI (kind picker, 4-step stepper, persistent edit-mode header). UI counterpart of SH-844 (discount engine). Classification: UI/Frontend-only.


  ## Execution

  Executed manually against https://app.stg.veevart.ai/ (authenticated session). Scenarios not covered are left not-run with a note. Evidence = live observation (browser screenshots are not persisted as files; the verdict and observations are captured in actual/notes).


  ## Findings / deviations vs AC

  - CREATE mode renders the top Save, status pill and metadata strip; the AC says that is edit mode only (defect SH-1049).

  - Step 1 ''Applies to modules'' offers only Ticketing + Memberships (+ Shop ''Coming in V2'', disabled); the AC expected a 2x3 grid of 6 modules (Courses/Camps, Groups, Rentals absent = V1 scope).

  - Labels: ''Internal name'' (AC: Code Name); ''Program'' on the rule (AC: Event); default Status ''Inactive'' (AC: Active).

  - Discount type is a single-option ''% Off'' dropdown (AC wanted a non-interactive control); the no-fixed-amount guarantee still holds.

  - ''Save Rule'' does not collapse the card to a summary (AC requires it); the rule is still accepted.

  - No ''Generate'' action for the Customer-facing code (defect SH-1054).

  - No confirmation dialogs on destructive actions: unchecking a module deletes its rules and the trash deletes a rule with no dialog (defect SH-1052).

  - Audience Type vs Ticket Types mutual exclusion not enforced (defect SH-1053).

  - Save (create/edit) returns to the list instead of the edit route / staying on the step (defect SH-1050).

  - Edit-mode header missing the overflow menu (Archive/Duplicate) and status quick-toggle (defect SH-1051).

  - Note: the header metadata strip sometimes lags in reflecting the derived channel change.


  ## Dependency

  Scenarios touching Save/Active (TC-18, TC-19) require the SH-844 engine deployed in the environment.'
