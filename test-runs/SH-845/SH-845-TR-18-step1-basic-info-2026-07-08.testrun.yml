notes: '## Solution understood

  SH-845 implementa la UI del Discount Authoring Wizard (picker de kind, stepper de 4 pasos, header persistente en modo edicion). Contraparte UI de SH-844 (motor de descuentos). Clasificacion: UI/Frontend-only.


  ## Ejecucion

  Por politica del executor, una historia UI-only NO se auto-ejecuta: cada escenario queda ''not-run'' con instrucciones manuales (ruta, accion, observable, captura). El tester ejecuta contra el ambiente con el build de SH-845 y adjunta las capturas bajo attachments/SH-845-TR-18/ui/.


  ## LIMITACION

  No hay PR de codigo accesible desde esta sesion (el PR #1 de testmanager-qa-repo son los artefactos QA, no la implementacion del wizard). Por lo tanto NO se corrio inspeccion de unit tests, regresion tecnica sobre el diff, ni scan OWASP sobre codigo: ver attachments/SH-845-TR-18/regression-notes.txt y owasp-top10-scan.txt (marcados N/A por falta de diff). La validacion funcional es 100% manual.


  ## Dependencia

  Escenarios que tocan Save/Active (TC-18, TC-19) requieren el motor SH-844 desplegado en el ambiente.


  ## Ejecucion en vivo 2026-07-08

  Ejecutado manualmente contra https://app.stg.veevart.ai/ (sesion autenticada). Alcance de esta corrida: core del wizard (picker, stepper, Step 1, Step 2 reglas + Application Mode, Step 3 matriz de canal). Escenarios no cubiertos quedan not-run con nota. Evidencia = observacion en vivo (las capturas del navegador no se persisten como archivo; el veredicto y lo observado quedan en actual/notes).


  ## Hallazgos / desviaciones vs AC

  - CREATE mode renderiza Save (arriba der.), pill de status y metadata strip; la AC dice que eso es solo edit mode. CANDIDATO A DEFECTO (a confirmar si es evolucion de diseno SH-850/853).

  - Step 1 ''Applies to modules'' ofrece solo Ticketing + Memberships (+ Shop ''Coming in V2'' disabled); la AC esperaba grid 2x3 de 6 modulos (Courses/Camps, Groups, Rentals ausentes = V1 scope).

  - Labels: ''Internal name'' (AC: Code Name); ''Program'' en la regla (AC: Event); Status por defecto ''Inactive'' (AC: Active).

  - Discount type es dropdown de una sola opcion ''% Off'' (AC pedia control no interactivo); garantia de no-fixed-amount igual se cumple.

  - ''Save Rule'' no colapsa la card a resumen de una linea (AC lo pide); la regla igual se acepta.

  - Application Mode: 3 opciones con semantica correcta pero labels reescritos y descripcion inline (no info-icon+tooltip).

  - Obs: el metadata strip del header tarda en reflejar el cambio de canal derivado.'
