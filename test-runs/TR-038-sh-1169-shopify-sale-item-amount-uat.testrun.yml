environment:
  name: qa
  buildVersion: "UAT sandbox veevartmuseumdemo--uat (org 00DD7000000OCIrMAO), managed package Auctifera 8.332.0.2. Second execution of TC-67: TR-035 validated the fix in the scratch org AuctiferaDX__sh1169 against the PR branch; this run validates the SAME test case against a real subscriber org running the released build, after PR #2569 (bug/shopify-sale-item-amount-calc-SH-1169) merged to main on 2026-08-05. Six of the eight scenarios were executed with the standalone anonymous-Apex scripts in AuctiferaDX branch test/uat-validation-apex-SH-1129-SH-1169 (scripts/apex/validateShopifySaleItemAmountSH1169-{A..F}.apex), one scenario per execution so each gets its own SOQL governor budget; all six wrap their DML in a savepoint and roll back, so UAT was left byte-identical to how it was found. QA FINDING ON THE HARNESS, NOT ON THE FIX: those six scripts did not run in UAT at all on first attempt — every one failed with System.SObjectException: Invalid field Technical_Bypass_Triggers__c for Auctifera__Sale_Item__c, because they wrote that one field name hardcoded without the ns prefix while namespace-qualifying everything else. That resolves fine in a scratch org, where the package code is deployed unmanaged, but in a subscriber org the field is Auctifera__Technical_Bypass_Triggers__c. The scripts were corrected to use ns + 'Technical_Bypass_Triggers__c' in put/get and in the SOQL projection, and only then produced the results below. The takeaway for future runs: a validation script that passes in a scratch org proves nothing about UAT or production until it actually runs there."
startedAt: "2026-08-13T13:45:00.000Z"
