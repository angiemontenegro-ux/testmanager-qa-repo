    notes: "FAIL con causa raiz identificada, y NO es que el fix este mal: es que los page layouts de un paquete gestionado no se actualizan en orgs suscriptores ya existentes. Evidencia: el layout de UAT tiene ManageableState=installed, fue creado el 2025-09-23 y su LastModifiedDate es 2025-09-23T13:37:50Z — nunca se toco desde la instalacion, casi un año antes de que se mergeara PR #2541 (2026-07-30). Nadie lo personalizo localmente. En cambio el cambio de CAMPO del MISMO PR si llego (Item_per_location__c describe nillable=true en UAT), lo que descarta que el build instalado sea anterior al fix. O sea: el paquete subio, el campo se actualizo, el layout no. IMPACTO: el fix hace que el lookup quede legitimamente vacio tras borrar un IPL, pero cualquier usuario que abra ese registro en Lightning y trate de guardarlo queda bloqueado por el Required del layout. Esto aplica a TODO org suscriptor existente, no solo UAT — incluido Eiteljorg, que es donde nacio el incidente de SH-1115 y donde justamente hubo que manipular estos registros a mano. El Required del layout es una restriccion solo de UI: la insercion por API con el lookup nulo funciona, por eso los Scenarios 1, 2, 3 y 5 pasan y este falla. REMEDIACION probable: actualizar el layout manualmente por org, o incluirlo en un post-install/upgrade step. Pendiente de decidir con el equipo si se abre defecto propio."
