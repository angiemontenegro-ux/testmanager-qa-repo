    reason: "Scenario 3 EJECUTADO y PASS, pasa de not-run a passed (3/6 -> 4/6). Ya no queda solo la evidencia de metadata: se probo corriendo, bajo System.runAs con un usuario de perfil 'Standard User' al que se le asigno el permset Veevart y la licencia de paquete Auctifera. El insert de Inventory_History__c en AccessLevel.USER_MODE tuvo exito y el lookup Item_per_location__c quedo escrito y legible; ademas sobrevive a Security.stripInaccessible(CREATABLE), que es la comprobacion de FLS aislada de sharing. Se desplego a UAT una clase de test temporal (SH1129FlsProbeTest) porque System.runAs solo existe en contexto de test y en UAT no hay ningun usuario no-admin con el permset; la clase fue eliminada del org al terminar y se verifico que no queda (0 filas en ApexClass). Dos falsos negativos descartados en el proceso, documentados en las notas del escenario: sharing de registro sobre los padres creados por el admin, y un bind de expresion no soportado en SOQL dinamico. Siguen not-run los Scenarios 4 (dedup del batch) y 6 (layout en Lightning)."
