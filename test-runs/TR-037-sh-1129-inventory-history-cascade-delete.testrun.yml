  buildVersion: "UAT sandbox veevartmuseumdemo--uat (org 00DD7000000OCIrMAO), managed package Auctifera 8.332.0.2. This is the first execution of TC-69 against a real subscriber org rather than a scratch org: PR #2541 (bug/inventory-history-cascade-delete-SH-1129) merged to main on 2026-07-30 and shipped in the build now installed in UAT. Deploy of the fix confirmed before executing anything — Auctifera__Inventory_History__c.Auctifera__Item_per_location__c describes as nillable=true / createable=true / accessible=true and no longer appears in the object's required-field list, which is exactly the required+Restrict -> optional+SetNull change the PR made. Scenarios 1, 2 and 5 were executed with three new standalone anonymous-Apex scripts added to AuctiferaDX in branch test/uat-validation-apex-SH-1129-SH-1169 (scripts/apex/validateInventoryHistorySH1129-{A-singleDelete,B-bulkDelete,C-noHistory}.apex); each wraps its DML in a savepoint and rolls back, so UAT was left byte-identical to how it was found. Scenario 3's open risk is now CLOSED on the evidence that mattered — see its notes. Scenarios 4 and 6 remain genuinely un-executed and are described honestly below; neither is blocked by a defect."
