        actual: "DESVIACION DECLARADA sobre el vehiculo, no sobre la asercion: el insert se ejecuto directamente en AccessLevel.USER_MODE bajo System.runAs(usuario estandar), NO corriendo InventoryHistoryBatch. Correr el batch en UAT escribe Inventory_History__c reales en todo el org y no se puede revertir; el insert directo en USER_MODE ejerce exactamente el mismo control de CRUD+FLS que es lo que este escenario asiere. Detalle de la ejecucion: no existe en UAT ningun usuario no-admin con el permset Veevart (los 9 asignados son System Administrator), asi que la prueba crea su propio usuario con perfil 'Standard User', le asigna el permset Veevart y le otorga la licencia de paquete Auctifera (el paquete licencia por usuario, PackageLicense.UsedLicenses=6; sin la licencia el fallo habria parecido de FLS sin serlo). Como System.runAs solo existe en contexto de test, se desplego a UAT una clase de test temporal, SH1129FlsProbeTest, y se elimino del org al terminar (verificado: 0 filas en ApexClass)."
        phase: when
        text: a standard user assigned the Veevart permission set triggers InventoryHistoryBatch to insert a new Inventory_History__c record
        attachments:
          - name: SH1129FlsProbeTest.cls
            path: attachments/SH-1129/TR-37/scenario-3-standard-user-fls/SH1129FlsProbeTest.cls
            mimeType: text/plain
      - order: 4
        status: passed
        actual: "PASS, 7 aserciones verdes. Bajo System.runAs(usuario estandar): Inventory_History__c createable=true; Item_per_location__c createable=true y accessible=true; el campo SOBREVIVE a Security.stripInaccessible(AccessType.CREATABLE) — si faltara el grant, ahi seria removido; el insert en USER_MODE tuvo exito sin excepcion; y la relectura en USER_MODE confirma que el lookup quedo escrito con el Id correcto, no vaciado por FLS. Test run 707D700004X0eeY, Passed, 1/1."
        phase: then
        text: the insert succeeds with no FLS/insufficient-access error, even though the field is no longer implicitly required
        attachments:
          - name: test-result.json
            path: attachments/SH-1129/TR-37/scenario-3-standard-user-fls/test-result.json
            mimeType: application/json
    notes: "PASS. Cierra el riesgo abierto que este ticket arrastraba desde el PR: al quitar required=true, Salesforce deja de otorgar FLS implicitamente, y el PR tuvo que agregar un <fieldPermissions> explicito al permission set Veevart, que NO se pudo validar en el scratch org AuctiferaDX__sh890 porque alli el deploy parcial de un permission set falla por campos no relacionados. Ahora esta probado ejecutando, no solo por inspeccion de metadata. DOS FALSOS NEGATIVOS DESCARTADOS EN EL CAMINO, que vale documentar para quien repita esto: (1) el primer intento fallo con INSUFFICIENT_ACCESS_ON_CROSS_REFERENCE_ENTITY sobre un Auctifera__CatalogItem__c — AccessLevel.USER_MODE valida sharing a nivel de registro ADEMAS de FLS, y los registros padre creados por el admin no son visibles para el usuario de prueba; se resolvio haciendo que el propio usuario de prueba cree sus padres, con lo cual un fallo en USER_MODE solo puede significar CRUD/FLS. (2) el segundo intento fallo en la relectura porque SOQL dinamico no acepta binds de expresion como :history.Id; se cambio por una variable simple. Ninguno de los dos era un defecto del producto."
    attachments: []
    defects: []

