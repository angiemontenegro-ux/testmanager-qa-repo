key: TR-26
title: 'Run SH-847: Embedded Discount Authoring Wizard from a Membership Program (live re-run)'
status: in-progress
environment:
  name: qa
  buildVersion: 'UI/Frontend-only. Live browser-driven re-run against https://app.stg.veevart.ai/ (Membership Programs -> Family Membership -> Discounts). Supersedes TR-25 not-run entries with directly-observed results. Static unit/regression/OWASP evidence carried from TR-25 (PR #137 + #239).'
  notes: 'Re-run requested due to a suspected environment-configuration problem. Staging was healthy; the FAILs below are the documented re-scope divergences (SH-1066/SH-1067), not environment artifacts. No discount persisted (draft discarded; Ticketing Discounts remained 0).'
notes: "## Solution understood\n\nSame as TR-25: SH-847 landed across PR #137 (reusable modal engine + Ticketing) and PR #239 / SH-950 (Membership program-record surface, program axis). This run validates the 12 functional scenarios LIVE on staging instead of leaving them not-run.\n\n## Execution\n\nBrowser-driven on https://app.stg.veevart.ai/ against Membership Program 'Family Membership'. Opened the Discounts section, launched the wizard via '+ New', walked Basic Info + Rules & Limits, tested module lock and the discard guard, then discarded the draft (no data saved). Client validation observed; engine save/error NOT exercised (would write data / cannot inject error safely) -> scenarios 7 and 8 remain not-run. Technical regression 7/7 PASS, security 5/6 PASS + 1 N/A, OWASP 1 applicable (A03) PASS / 9 N/A carried from TR-25 (static, unchanged).\n\n## Observed result: 0 passed / 10 failed / 2 not-run\n\nAll 10 failures are story-vs-implementation divergences (intentional re-scope), tracked in SH-1066 (modal vs full-screen takeover) and SH-1067 (AC divergences). Highlights observed live: '+ New' opens a role=dialog modal (not a takeover); no two-card 'Add discount' modal; kind is a selectable combobox (not locked); Status defaults Inactive (AC: Active); Ticketing module pre-checked (AC: Memberships); module checkboxes locked (cannot add a module); Step 2 pre-seeded rule on the PROGRAM axis ('Membership Program = Family Membership' + 'Program = All Programs'), not a Membership Type dropdown per SH-846; discard guard exists via 'Back' but with different copy ('Discard discount draft?'). See attachments/SH-847/TR-26/ui-observations.txt.\n\n## Note\n\nThese are not new regressions and not environment issues. If Product confirms the re-scope, resolve by updating SH-847's acceptance criteria and re-baselining TC-22; otherwise route SH-1066/SH-1067 to dev. Do not transition SH-847 to Done until adjudicated."
