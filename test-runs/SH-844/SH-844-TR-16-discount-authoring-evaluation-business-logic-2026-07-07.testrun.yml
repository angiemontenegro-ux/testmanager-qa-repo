  name: qa
  buildVersion: 'Backend TypeScript/NestJS (VeevartBackend@main domains/discounts) - acceptance validation of MERGED SH-844 discount engine; frontend (VeevartFrontend@main) checked for History view. Executed via vitest suite (994/994 relevant pass under project configs) + static code+spec mapping. Clasificacion: Pipeline/Backend (Mixed BE+FE check).'
notes: "## Solution understood\nSH-844 shipped a hexagonal Discount Engine in VeevartBackend (domains/discounts) covering authoring (Promotion aggregate + ~14 guards), evaluation (9-stage pipeline, exclusive highest-wins selection), usage counting (event-sourced, increment-only, OCC), quote-options, benefit-offers and lifecycle/audit. Validated the MERGED code on main (no single PR - SH-844 is a multi-PR epic).\n\n## Test evidence\nRan the discounts vitest suite: 994 tests pass under the projects' intended configs. 19 tests that initially failed when the whole tree was forced through the ROOT vitest.config.ts were proven to be TEST-TOOLING ARTIFACTS, not product defects:\n - 14 controller-validation specs (evaluate/quote-options/benefit-offers) fail under esbuild because esbuild does not emit design:paramtypes, so Nest ValidationPipe cannot resolve the @Body() metatype and skips validation. Under swc (decoratorMetadata:true) all 23+22 pass. Production build (tsc) emits metadata, so validation\
  \ returns 400 correctly.\n - 5 ACL plugin specs fail only when run from the workspace root (relative path src/manifest.yaml); from the ACL package root with its own vitest.config.mts all 9 pass.\nNet: no SH-844 business-logic regression in the failing tests.\n\n## Verdict categories for the 9 FAIL scenarios\nIntentional/documented deviations (align testcase, not defects): TC-1.0 (SH-916 drop application_mode), TC-7.1 (no Archived->Active reactivation), TC-9.3/BUG-004 (200 vs 201 on addRule).\nTestcase-vs-contract drift (fix testcase): TC-6.0, TC-6.1 (quote-options shape + conditional-offer concept never in V1).\nGenuine gaps worth a ticket: TC-4.5 & TC-4.8 (evaluate has no POS channel / Shop line / per-line application_mode - likely V2), TC-5.5 (no structured envelope for unexpected internal errors -> 500), TC-7.2 (field_history write exists but no History read endpoint/UI).\nOut of scope by design (skipped): TC-8.0-5 = V2 counter/lifecycle/stacking; testcase is DRAFT and states 'DO NOT\
  \ run against V1'.\n\n## Security / OWASP\nCRITICAL watchlist item BUG-001 (cross-tenant leak on missing x-tenant-id) is RESOLVED by the SH-866 auth rewrite (tenant derived from verified JWT; 401 when absent). No High/Critical security defect found on main. OWASP A01 (access control) PASS; A03 (injection) PASS in production build. See attachments/regression-results.txt + owasp-top10-scan.txt.\n\n## LIMITATION\nAtlassian MCP is not authenticated in this non-interactive session: Jira ticket SH-844 could not be fetched and defects could not be auto-created. All FAILs are documented here with evidence for the user to open tickets. Executed against merged main, not a single PR.\n\n## Refresh 2026-07-07T19:35Z\nRegenerated after TC-1/TC-6/TC-7 were aligned to shipped V1 behavior (testcases v2). Four scenarios that were red only due to testcase drift/intentional deviations now PASS (TC-1.0, TC-6.0, TC-6.1, TC-7.1). Remaining 5 FAIL are genuine gaps: TC-4.5 & TC-4.8 (no POS channel/Shop line at\
  \ evaluate), TC-5.5 (internal-error contract), TC-7.2 (audit read/History UI missing)."
