notes: '## Solucion entendida


  La PR #659 de VeevartFrontend anade el drill-in por variante que pedia el AC3 de SH-1063, pero como MODAL y no como

  ruta. Antes, la pestana Variants era una tabla read-only sin ninguna forma de inspeccionar una variante concreta: el

  `variant.id` solo existia como `key` de React. La PR cablea `onRowAction` de la tabla del design system (sin

  `selectionMode`, para que el click sea activacion y no seleccion) a un `VariantDetailModal` net-new que muestra los

  mismos 8 campos de la fila, reusando las claves i18n de la tabla en vez de duplicar copy. Solo el id de la variante

  vive en estado (`selectedVariantId`); la variante misma se re-deriva en cada render desde el array COMPLETO de

  variantes, no desde la pagina actual, y por eso un refetch en background actualiza el modal abierto en vez de

  congelarlo. Una bandera aparte (`isDetailModalOpen`) evita el bug feo: si la variante desaparece del set el modal se

  cierra solo, y si mas tarde reaparece NO se vuelve a abrir sin accion del usuario. La PR tambien extrae

  `resolveProductPrimaryImage` a su propio modulo para que la cabecera y el modal compartan la misma resolucion de

  imagen. Efecto lateral esperado: la tabla ahora tiene un handler de activacion, asi que los tests de "sin controles de

  mutacion" se re-ejecutan con el handler montado — y siguen pasando, incluido el caso con Pagination visible.


  ## Correccion de proceso: se verifico contra la rama equivocada


  El hallazgo mas importante de este run no es del producto, es del metodo. La v1 de TC-75 concluyo que el drill-in del

  AC3 NO EXISTIA. Era falso. Se habia leido `main` de VeevartFrontend y un worktree de VeevartBackend sobre

  `origin/staging` que estaba 91 commits detras de `origin/develop`. La rama de integracion de LOS DOS repos es

  `develop`. El clon de VeevartFrontend trae solo `main` en su refspec, asi que `develop` queda congelado y un grep

  sobre el working tree miente por omision — es el mismo gotcha ya registrado para este repo, aplicado esta vez a la

  eleccion de rama y no solo al fetch. Todo hallazgo de este TR se rehizo contra `develop`.


  ## Los cuatro hallazgos, y por que solo uno es FAIL


  H1 — FAIL (escenario 3). El resumen no muestra NINGUNA cifra de costo. Esto contradice el AC2, que pide costo

  promedio, y contradice TAMBIEN la decision D9 que corrigio ese AC y pide CPP ponderado por cantidad. No es "el AC

  quedo viejo y el spec lo corrigio": el spec entregado (`Inventory Summary Is Per-Variant On-Hand Only`) no cumple

  ninguna de las dos reglas, y un test del dev PROHIBE activamente el campo. Impacto real bajo — no hay dato erroneo en

  pantalla, hay un dato ausente — pero es una desviacion real de especificacion, no una laguna de cobertura. Necesita

  ruling: o se construye el CPP ponderado sobre `average_cost`, o se corrigen el AC2 y D9 para reconocer que el resumen

  es solo on-hand.


  H2 — no es FAIL. La mitad de imagenes del AC3 esta diferida: el modal muestra la imagen del PRODUCTO padre, no la de

  la variante. No se marca FAIL porque la sustitucion esta especificada y, sobre todo, esta ROTULADA al usuario con un

  caption visible que dice de quien es la imagen. Pero el backend en `develop` YA soporta imagenes por variante

  (`variant-image-display.ts` expone `images` + `imagesInherited`), asi que el dato existe y la UI decide no usarlo:

  necesita visto bueno antes de firmar AC3 como completo.


  H3 — no es FAIL. El AC4 dice que stock y costo son de solo lectura. `cost` SI es escribible via PATCH de variante, a

  proposito (decisions.md:976 y :1759). El codigo esta bien; el AC esta mal redactado. Gap menor anexo: el 422 tipado

  `FIELD_NOT_EDITABLE_FROM_CATALOG` sigue sin implementarse y hoy cae como 400 generico de zod.


  H4 — no se vuelve a filar. `itemType` sigue vivo de punta a punta en la API de `develop` y un producto Service nuevo

  sigue siendo creable, pero la VISTA — que es lo que SH-1063 posee — esta limpia: cero referencias a tipo de producto o

  Service en las cuatro tarjetas ni en los messages. La contradiccion ya esta registrada como FAIL en TR-046 escenario 8

  y espera ruling; volver a fallarla aqui la contaria dos veces. Pertenece a SH-1137 / SH-1167.


  ## Calidad de los tests del dev


  Es la superficie mejor cubierta que he revisado de esta epica: 33 tests en VariantsTable, 12 en VariantDetailModal, 15

  en InventoryCard, y los casos duros estan cubiertos de verdad, no de adorno — la variante correcta en la SEGUNDA

  pagina, datos vivos tras refetch con el modal abierto, cierre sin reapertura fantasma, clamp de pagina al encoger el

  set, y un barrido de "sin controles de mutacion" que lee el NOMBRE ACCESIBLE y no el textContent (un boton solo-icono

  habria pasado invisible con la version anterior). El propio design.md documenta que un mutation test probo que la

  suite anterior no distinguia string de boolean en el estado de imagen fallida, y que lo arreglaron. No hay "cambio

  sustantivo sin cobertura" que compensar.


  ## Pendiente que no depende de mi


  RESUELTO 2026-09-04: Angie decidio AGRUPAR los hallazgos en un solo defecto para no generar ruido con varios bugs

  sueltos. Archivado como SH-1269 (Bug, Medium, enlazado a SH-1063), que cubre H1, H2 y H3 en una sola conversacion de

  reconciliacion, dejando claro cual de los tres necesita codigo (solo H1) y cuales se cierran corrigiendo la redaccion

  de la historia. H4 queda FUERA a proposito: ya esta registrado como FAIL en TR-046 escenario 8 y pertenece a

  SH-1137 / SH-1167. Lo que sigue pendiente no es de QA sino de producto: el ruling sobre si se construye el CPP

  ponderado o se corrigen el AC2 y D9.'
