title: 'Run: SH-1057 la variante tecnica (wildcard) siempre existe — minteo zero-options, wildcard dormido, SKU compartido,
  invariante de >=1 variante, Cardex por variantId y la contradiccion del carve-out de Service (TC-74) contra origin/staging
  b5ab930e de VeevartBackend + main de VeevartFrontend, SH-1057 / QA Sub-task SH-1160'
status: in-progress
environment:
  name: local-source
  buildVersion: 'Mixed (backend TS dominio/aplicacion + frontend React wizard). ENTORNO: NO se probo en navegador ni en una
    instancia desplegada. LA HISTORIA NO TIENE PR PROPIA: ninguna PR lleva la clave SH-1057. El slice se entrego repartido
    en ~14 PRs rotuladas con la clave del EPIC (SH-793), todas MERGEADAS, en DOS repos: VeevartBackend #1241 #1271 #1278 #1283
    #1285 #1287 #1300 #1337 y VeevartFrontend #462 #508 #520 #526 #543 #570. Mismo patron que SH-1094: la etiqueta de la PR
    es un epic, no la historia. BACKEND: worktree local en origin/staging b5ab930e (''back-merge main -> staging (#1503)''),
    suite ejecutada de verdad — 13 archivos de spec del slice, 148/148 PASS, y la suite completa del paquete 1451 assertions
    PASS con 0 fallidas y 327 skipped. FRONTEND: VeevartFrontend NO esta clonado, asi que su verificacion es ESTATICA (codigo
    fuente + nombres y asserts de los tests del dev leidos por la API de GitHub), no ejecutada. ATENCION — EL CODIGO YA ESTA
    EN MAIN: git ls-tree confirma que origin/main contiene rebuild-variants.ts, post-movement-line-builder.ts y service-inventory-policy.ts,
    asi que todo hallazgo aqui ya es alcanzable en produccion. GOTCHA DEL CLON: el refspec del repo es solo main (+refs/heads/main:refs/remotes/origin/main);
    staging y develop necesitaron fetch explicito, y sin eso un fd/grep sobre el working tree miente diciendo que los archivos
    no existen. LIMITE DIVULGADO 1: pnpm install NO puede completar — ERR_PNPM_FETCH_404 en el paquete privado @veevarts/acl-core@0.1.0-alpha.4
    sin token de registry. Se resolvio el grafo al store .pnpm y se linkearon 1160 paquetes a mano para poder correr vitest
    3.2.6. El primer intento reporto ''8 failed | 3 passed'' con ''Tests 33 passed (33)'': eran errores de RESOLUCION de import
    a nivel de archivo, CERO asserts fallidos, y no se registran como fallas. LIMITE DIVULGADO 2: no hay Docker en esta maquina,
    asi que los 41 archivos .integration.spec.ts fallan todos con ''Could not find a working container runtime strategy''.
    Verificado 1:1: los 41 son integration, ninguno es unitario y no hay ni un marcador de assert fallido. Entre los bloqueados
    esta uno del slice, wildcard-sleep-wake-round-trip.integration.spec.ts. Sin SQL y sin metadata de Salesforce: no aplica
    safesql ni carga a sandbox. VEREDICTO: 7/8 PASS, 1 FAIL (escenario 8, contradiccion spec-vs-implementacion del carve-out
    de Service). Regresion tecnica 9/10 PASS + 1 BLOCKED por Docker, seguridad 6/6 PASS, OWASP 3 aplicables (2 PASS, 1 FAIL
    A04 Medium) y 7 N/A, 0 bloqueadores de seguridad.'
