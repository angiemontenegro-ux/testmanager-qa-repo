notes: '## Solution understood


  SH-1057 pide que ningun producto exista sin variantes, para que el stock y el costo vivan siempre a nivel de variante. El
  codigo lo resuelve con lo que llama el WILDCARD (no ''technical variant'': ese nombre no aparece en el codigo), una variante
  sin combinacion marcada con origin ''implicit''. rebuild-variants.ts tiene DOS brazos de minteo que no pueden coexistir:
  si el producto no tiene opciones y no queda ninguna fila que cargue la combinacion vacia, mintea UN wildcard despierto (isDefault
  true, status active) y retorna; si el producto SI tiene opciones y es nuevo, mintea uno DORMIDO (isDefault false, status
  inactive) cuyo unico proposito es darle casa al SKU base que el comerciante tipeo y que antes se tiraba a la basura. Lo
  dormido es la mitad que sostiene el diseno: un wildcard despierto al lado de las tallas reales seria vendible, apareceria
  en el picker de OC y reclamaria el default, lo que daria un 23505 contra el indice unico parcial uq_product_variants_product_default
  en un guardado ordinario. ensureAtLeastOneDefault corre despues y promueve solo filas SELLABLE, asi que pasa por encima
  del dormido. En el Cardex nada se mueve por producto: stock y location_stock tienen variant_id en la PK, asi que una fila
  de movimiento sin variante no es representable.


  ## Lo que este run corrige de lo que estaba escrito


  1. El plan de SH-1160 daba por abiertos dos riesgos que ya estan cerrados (no existe modulo de Cardex; el sku a nivel de
  producto no llega al backend). Ambos estan construidos y con tests.

  2. El criterio agregado #1 del ticket pide una fila etiquetada ''technical'' con ''Same SKU as the item''. Fue ANULADO,
  no olvidado, y las DOS mitades tienen test que protege su ausencia (options-copy.test.ts:163 y :158). No filar defecto sin
  ruling.

  3. Sobre el carve-out de Service, ni la lectura de Cesar ni la del plan estaban completas. Ver el escenario 8.

  4. Aparente contradiccion que NO lo es: un comentario en options-copy.test.ts dice que la variante nace con sku null, mientras
  Cesar dice que el SKU del item viaja. Las dos son ciertas — el comentario describe unicamente el caso en que el campo Item
  SKU se deja vacio ('':265 sends no variants block at all when form.sku is empty'').


  ## Costo aceptado a sabiendas, registrado y no filado


  Cada producto con opciones carga desde su nacimiento un wildcard dormido que gasta uno de los 24 slots de variante del plan
  Composite de Salesforce (SHOP_ITEM_SNAPSHOT_MAX_VARIANTS), bajando el techo real a 23 para TODOS los productos. Cesar acepto
  ese intercambio explicitamente en vez de aplazarlo a un relevamiento. Queda anotado para que nadie lo descubra como sorpresa.


  ## Pendiente que no depende de mi


  Escenario 8 necesita (a) un ruling de producto sobre la contradiccion con SH-1137 y (b) un dato que no puedo consultar:
  si existen filas reales con item_type=''service''. Escenario 6 necesita Docker para el round-trip de dormir/despertar.'
