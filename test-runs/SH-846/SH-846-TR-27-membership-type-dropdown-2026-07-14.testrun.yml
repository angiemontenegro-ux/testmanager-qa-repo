title: 'Run SH-846: Membership Type dropdown populated from the Memberships service (static PR review)'
status: in-progress
environment:
  name: qa
  buildVersion: 'UI/Frontend-only. Static review of Veevarts/VeevartFrontend#173 (feat/discount-wizard-field-enablement-SH-916, MERGED). #173 is the FE half of SH-916 but carries the SH-846 slice ("membership types from the real API"). No browser-driven run (VeevartFrontend not checked out locally); data/logic verdicts derive from source + dev unit-test inspection.'
  notes: 'PR #173 bundles SH-846 under SH-916. The SH-846 slice = wiring the Membership Type dropdown to GET /api/fundraising/membership-programs/membership-types via listMembershipTypes + shared parseMembershipTypes decoder. Data/logic layer strongly covered by dev tests. UI behavioral states (loading/empty/error+retry/cache, "All Memberships" default render) not browser-verified -> left not-run for manual QA. One confirmed spec-vs-impl gap: dedup (scenario 8).'
notes: "## Solution understood\n\nSH-846 asks the Discount wizard's Step 2 Membership Rule card to populate its Membership Type dropdown from the real Memberships service instead of a static placeholder. In PR #173 this is implemented as: (1) a thin transport client `listMembershipTypes()` that GETs the BFF path `/fundraising/membership-programs/membership-types` and hands the raw JSON to (2) the shared Zod decoder `parseMembershipTypes` (packages/ticketing-limits) which is the single source of truth for both the portal client and the shop embed. The decoder: filters non-archived (`status !== 'archived'`, case-insensitive, handles PascalCase + missing status), maps each item via the id ladder `id ?? membershipTypeId ?? value`, exposes `externalId`, drops malformed items per-item (missing label or no id/membershipTypeId/value), and sorts alphabetically by label. Payload mapping (promotion-authoring-mappers) sends `membershipTypeId: rule.membershipTypeId === '__all__' ? null : rule.membershipTypeId` — i.e. the 'All Memberships' sentinel `__all__` becomes `null`, a specific selection sends its id.\n\n## Classification\n\nUI/Frontend-only. Per QA routing, behavioral UI states are handed off for manual verification; data + logic layers are validated by static source + unit-test inspection.\n\n## Unit tests\n\nmembership-types-client.test.ts (~18 assertions) + the shared parser test cover: canonical + legacy shapes, id ladder, active-only filter, alphabetical sort, per-item isolation, unknown-field tolerance, ApiError on non-OK. mappers test covers `__all__`->null / else id. PR body: 200 discounts-feature vitest tests green (not re-run locally). See attachments/SH-846/TR-27/scenario-0-unit-tests/.\n\n## Technical + Security regression\n\nTechnical: shared decoder = single source of truth (no host drift), hardcoded endpoint path, payload mapper unit-tested — all PASS, no non-advertised deltas. Security: A03 Injection PASS (Zod-validated, no innerHTML/eval/concat, fixed path); no secrets, no PII logging, no SSRF, no dep changes, no auth/RBAC touch. 0 High/Critical. OWASP Top 10: 1 Applicable (A03) PASS / 9 N/A. See regression-results.txt + owasp-top10-scan.txt.\n\n## Findings\n\n1. DEDUP GAP (scenario 8, FAIL): parseMembershipTypes has NO dedup step (filter->map->sort only), but SH-846 Scope explicitly lists 'sorted by display name, deduped, active-only'. If the endpoint ever returns duplicate types they render twice. Low real-world impact (active types usually distinct) but a documented scope deviation. Defect pending user adjudication.\n2. NO EVIDENCE for loading / inline-error+Retry / session-cache (scenarios 4,6,7): not found in the #173 diff. May be handled by a generic Select/react-query elsewhere OR not implemented. Must be confirmed in the running app.\n3. Field naming: story prose says `membership_type_id`; implementation uses `membershipTypeId` (camelCase). Not a defect.\n\n## QA verdict\n\nPartial: 2 passed (logic) / 1 failed (dedup) / 5 not-run (manual UI). Do NOT transition SH-846 to Done until the dedup gap is adjudicated and the 3 UI states are manually confirmed."
