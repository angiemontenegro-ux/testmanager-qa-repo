notes: '## Solution understood


  SH-1097 pone en el Step 2 del wizard de descuentos las tarjetas de regla de Ticketing y de Shop con alcance por regla. Lo
  que estaba mal antes: el alcance y las fechas vivian a nivel PROMOCION, asi que no se podia decir ''este 20% aplica solo
  a la categoria Libros entre el 1 y el 15'' sin afectar al resto del descuento. Lo que hace el cambio: cada regla lleva su
  propio scope (Program/Events o Category/Item), su Membership Program opcional como GATE, sus cuatro contadores opcionales,
  su modo de redencion y su ventana activa. Por que funciona: el gate de membresia es el eje que colapsa la tarjeta — isTicketingRuleMembershipGated
  decide seis campos del payload de una sola vez, y ''authorsDateWindow = !isGated'' es a la vez la condicion de render de
  la seccion ACTIVE WINDOW y lo que el guardado proyecta, asi que la tarjeta no puede ocultar un campo y despues escribirlo.
  Efectos colaterales esperados y verificados: (a) una ventana guardada SOBREVIVE al guardado de una regla gated — invariante
  defendida por un archivo de tests propio porque un bug previo la borraba; (b) el Item cascadea desde la Category y se descarta
  si queda huerfano, de modo que ningun id fuera de alcance llega al payload; (c) los contadores se muestran marcados como
  no-enforced en vez de prometer un limite que nada aplica.


  ## Los 3 hallazgos que SI son huecos frente al AC vigente


  1. TICKETING NO TIENE LA GUARDA PREVENTIVA DE ''+ Add Rule'' (TC-53.1). Shop y Memberships deshabilitan el boton cuando
  ya existe una regla universal; Ticketing no. El admin autora una segunda regla y pierde el trabajo en un rechazo del backend
  al guardar (ticketingAllEventsMustBeOnlyRule). La omision es deliberada y razonada en RulesLimitsStep.tsx:1626-1637 (el
  predicado del backend es gate-blind, espejarlo crearia un candado equivocado), asi que necesita decision de Product, no
  un fix mecanico.

  2. LA TARJETA VIVA DE SHOP QUITA EL ITEM EN SILENCIO AL ACOTAR LA CATEGORY (TC-63.3). La advertencia existe solo en el editor
  retirado y es un conteo, no una lista. Sin riesgo de datos; el admin simplemente no se entera.

  3. EL STEP 4 REVIEW NO DICE DE DONDE VIENEN LAS FECHAS DE CADA REGLA (TC-52.2). No hay ninguna clave de origen de fechas
  en el catalogo del review ni referencia a dateScope en review-model.ts. Los datos ya estan en la regla; falta la linea.


  Aparte, dos campos que el TC da por existentes y no se construyeron: el banner de INTERSECCION evento+membresia (TC-51.4)
  y el campo QUALIFYING ITEM TYPE de 3 opciones (TC-63.1). Este ultimo merece confirmacion de Product: el TC dice que se corrigio
  dos veces contra el prototipo, y como Min/Max Quantity se corto de la misma tarjeta el 2026-07-22, lo mas probable es que
  tambien se cortara — pero sin registro de decision no se puede cerrar como corte intencional.


  ## Test cases que hay que arreglar, no defectos que abrir


  TC-51.5 AFIRMA UN DEFECTO COMO ESPERADO: pide que las fechas custom se BORREN al elegir despues un evento o una membresia.
  El comportamiento enviado es el contrario y es una invariante con archivo de tests dedicado (rule-date-window-card-path.test.tsx),
  escrito precisamente porque un bug borraba la ventana de toda regla gated al guardar. NO abrir defecto: reescribir el escenario
  para que afirme PRESERVACION.

  TC-55 COMPLETO ESTA OBSOLETO: el switch ''Members only'' se elimino por FP7 y la gestion de membresia paso a ser por regla.
  No hay control que bloquear, asi que los 3 escenarios van skipped y el TC hay que retirarlo o reescribirlo contra el gate
  por regla.

  TC-52.1 y TC-52.3 piden un formato prohibido por diseno (''0 / 500 uses'', ''Unlimited'' por contador). RestrictionsStep.tsx:94-97:
  ''there is no confirmed-sale producer, so every usage counter in this system reads zero''. Un ''0 / 500'' seria un dato
  falso.

  TC-51.1, TC-51.2 y TC-51.6 asumen el auto-hide previo a Fix 19; hay que reescribirlos contra el toggle explicito.


  ## Suite del dev


  87 archivos, 2.750 tests, 2.748 pasan (99,93%). Los 2 fallos son ARTEFACTO DEL ENTORNO LOCAL, probado con un experimento
  controlado de una sola variable: cada uno se re-corrio en el commit que lo INTRODUJO (232ab173 / PR #513 y ac94a31e / PR
  #529) y falla tambien ahi, siendo que el CodeBuild CI de ambas PRs paso. Son aserciones de aria-invalid / aria-describedby
  sobre ids generados por React-Aria. La cobertura del dev es densa y NO es el eslabon debil de este run.'
