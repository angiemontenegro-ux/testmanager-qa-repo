environment:
  name: qa
  buildVersion: "Salesforce-bound (Apex logic + schema, no ETL/CSV). PR #2567 (Veevarts/AuctiferaDX, branch story/landed-cost-expenses-SH-1174, head f3b892c702a3189acedef26a3b9e108618c71abd) fixes Shop 1.0 excluding PO expenses from the moving weighted average cost. Adds LandedCostAllocator (prorates a PO's Total_Expenses__c by value across received lines, fallback by qty when total value=0, exact reconciliation with remainder to largest line, 6-decimal internal precision), a 3-arg overload of ICHCostCalculationService.calculateWeightedAverageCost accepting an effective-cost override (2-arg delegates with null = fully backward-compatible raw-cost path), wired into ItemCostHistoryService's create and recalc paths, plus a PurchaseOrderTriggerHandler re-prorate hook for expenses added/edited AFTER receipt. Deployed fresh to AuctiferaDX__sh890 (the PR's own named validation org; its previously-installed classes predated the PR's latest commit, so QA redeployed with --ignore-conflicts before trusting results) and ran LandedCostAllocatorTest + LandedCostOnReceiptTest independently: 10/11 PASS, 1 deterministic FAIL (addingExpenseAfterReceiptReproratesLandedCost — Current_Item_Cost__c goes to $0.00 instead of $10.00 when a PO expense is added after the goods are already received). Confirmed on an isolated re-run. Filed as SH-1182 (High, blocks SH-1174). Per QA protocol, execution stops here: no further regression/sandbox validation until the defect is resolved. Regression + security + OWASP prep already completed and recorded below remain valid independent of this defect."
