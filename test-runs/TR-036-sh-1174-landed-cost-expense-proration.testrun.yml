title: "Run: Order expenses are prorated by value and folded into the item's average cost (landed cost)"
status: in-progress
environment:
  name: qa
  buildVersion: "Salesforce-bound (Apex logic + schema, no ETL/CSV). PR #2567 (Veevarts/AuctiferaDX, branch story/landed-cost-expenses-SH-1174, head f3b892c702a3189acedef26a3b9e108618c71abd) fixes Shop 1.0 excluding PO expenses from the moving weighted average cost. Adds LandedCostAllocator (prorates a PO's Total_Expenses__c by value across received lines, fallback by qty when total value=0, exact reconciliation with remainder to largest line, 6-decimal internal precision), a 3-arg overload of ICHCostCalculationService.calculateWeightedAverageCost accepting an effective-cost override (2-arg delegates with null = fully backward-compatible raw-cost path), wired into ItemCostHistoryService's create and recalc paths, plus a PurchaseOrderTriggerHandler re-prorate hook for expenses added/edited AFTER receipt. VERDICT: the PR's own test suite passes 11/11 on the exact committed code, confirmed in TWO independent orgs — AuctiferaDX__sh1169 with the byte-exact f3b892c files deployed, and sh1174qa created clean today from the PR branch with a full force-app deploy (12,425/12,425 components, 0 errors). CORRECTION: this run's first execution reported addingExpenseAfterReceiptReproratesLandedCost as a deterministic FAIL ($0.00 instead of $10.00) and raised SH-1182 as a High blocker. That was WRONG — an artifact of AuctiferaDX__sh890, whose metadata baseline is ~1 month old (created Jul 9) and onto which QA had deployed only the PR's 12 changed files. This change depends on a trigger chain (expense insert -> Total_Expenses__c roll-up -> PurchaseOrderTriggerHandler -> ICH recalculation), so the org's whole metadata state is part of the test subject; a partial deploy onto an old baseline produced a failure that does not exist in the code. sh890 is retired from SH-1174 validation. SH-1182 downgraded to Low, retitled as likely-invalid, and a manual close as Cannot Reproduce requested (no closing workflow transition was available). Full detail: attachments/tr-036-tc-70/scenario-0-unit-tests/CORRECTION-org-artifact.md. Regression + security + OWASP results below stand unchanged. RESCOPED 2026-08-11 (TC-70 v2): the original short-receipt scenario was not executable — Shop 1.0 has a single quantity field (Order_Amount__c) and no partial-receipt status, so 'ordered 100, received 80' cannot be entered on the purchase. It was split into idx 4 (expense prorates over the full ordered quantity) and a new idx 5 (a later Inventory Adjustment must not corrupt the landed average), and the trailing indices shifted 5-8 -> 6-9. Three scenarios are now not-run (idx 2, 4, 5) and remain genuinely open — real coverage gaps in the PR, unrelated to the retracted defect."
