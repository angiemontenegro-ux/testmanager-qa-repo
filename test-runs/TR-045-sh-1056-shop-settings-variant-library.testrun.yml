  classification: Mixed (backend API + frontend UI), remote-only
  solutionSummary: 'El ticket pedia una biblioteca de variantes a nivel de tienda. Antes de esto la lista de Size/Color/Material
    vivia hardcodeada en el picker del item wizard, o sea que cada tenant usaba lo que trajera el codigo y no podia definir
    lo suyo. El backend agrega dos tablas nuevas tenant-scoped, shop_variant_types y shop_variant_type_options, con CRUD
    completo, activar/desactivar independiente (sin cascada), reorder de opciones sobre un constraint DEFERRABLE, dos endpoints
    informativos de conteo de uso y un GET /active que sirve la biblioteca activa completa en una sola llamada para el wizard.
    Es una adicion pura: +5162 / -0, y app.module.ts solo agrega imports y providers, asi que ningun comportamiento existente
    cambia. El frontend convierte /shop/settings en un hub de tres paneles (Categories / Locations / Variant Library), deja
    las rutas planas viejas como redirects con la seccion preseleccionada, y construye el CRUD inline: crear con compose
    card, renombrar in situ, valores como chips con lapiz de edicion, alta por lote separada por comas resiliente a una
    carrera real del backend via Promise.allSettled, y 7 rutas proxy del portal. La decision de diseno que gobierna todo
    el comportamiento observable es D2 ''copy-not-reference'', ratificada en D239 y D277: el producto COPIA el texto del
    nombre y del valor en el momento de seleccionarlo y NUNCA guarda el id de la fila de biblioteca. De ahi se derivan las
    dos desviaciones frente al ticket: como borrar o renombrar una entrada no puede afectar a ningun producto, el owner
    quito la puerta de uso en el borrado (D8 superseded by D277) y con ella la advertencia que pedia el AC3; y por separado,
    tambien con confirmacion del owner, se elimino todo tope de tamano, con lo que el contador ''Variantes: N / 100'' del
    ticket nunca se construyo.'
  unitTestsInPR: 64 archivos de test entre las dos PRs (23 backend, 41 frontend), 306 bloques it() en el diff (94 backend,
    212 frontend). Cobertura amplia y real, incluyendo integracion contra Postgres con Testcontainers y e2e de aislamiento
    cross-tenant. Cero gaps atribuibles al dev.
  localSuite: 'NO EJECUTADA. Ninguno de los dos repos es usable localmente (ver environment.buildVersion y test-run-log.txt).
    Evidencia sustituta: CI verde en las dos PRs -backend-ci / Test PASS 5m56s, Lint, Typecheck y Build PASS; frontend lint
    PASS y CodeBuild PASS- mas el plan de pruebas declarado por el dev en la PR #1390: pnpm nx test shop-catalog-api --skip-nx-cache,
    164 archivos / 1773 tests, 1760 pasados + 13 skipped, re-corrido en fresco dos veces.'
  technicalRegression: 7/7 PASS. T5 pasa con observacion operativa (ver observations OBS-3).
  securityRegression: 9/9 PASS, 0 bloqueadores High/Critical. S9 pasa con observacion de endurecimiento.
  owaspTop10: 6 aplicables (A01, A03, A04, A06, A09, A10) todos PASS -A04, A09 y A10 con observacion registrada- - 0 FAIL
    - 4 N/A justificados (A02, A05, A07, A08)
  defects: []
  defectsPending: 'CERO defectos creados. Los 4 FAIL no son bloqueadores de seguridad ni fallos de CI: son desvios entre
    SH-1056 y decisiones del owner posteriores, de impacto real bajo. Por la regla 7b del skill quedan escritos en el run
    con evidencia completa y su radicacion espera decision de Angie. Propuesta: DOS defectos, uno por causa raiz -hallazgo
    1 (contador y limite 100 no construidos, afecta escenarios 1 y 8) y hallazgo 2 (advertencia ausente al renombrar y al
    eliminar, afecta escenarios 6 y 7)- o uno solo agrupado si se prefiere tratarlo como ''actualizar SH-1056 a las decisiones
    del owner''. Hay un tercer hallazgo, el hallazgo 3 (spec.md del backend desactualizado), que no afecta ningun escenario
    y podria ir como tarea de documentacion.'
  observations:
  - 'OBS-0 (ALCANCE DEL ENTORNO, leelo primero): esta corrida NO se ejecuto en Dev ni en staging y NO uso navegador. Se
    ejecuto contra el codigo fuente del diff de las dos PRs, los tests del dev y el estado de CI. Las dos PRs estan mergeadas
    a develop y promovidas a staging (PR #1438), asi que la evidencia funcional que quede pendiente se puede capturar en
    staging, que es donde la pantalla esta desplegada.'
  - 'OBS-1 (LA MAS IMPORTANTE): los 4 FAIL no son bugs de codigo. Son dos decisiones del owner que se documentaron en los
    spec.md de los dos repos y en el codigo, pero que nunca se reflejaron en SH-1056. (a) ''No Size Cap'': el spec declara
    textualmente que el sistema NO debe imponer ningun maximo, con escenario de crear la categoria 201; el ticket pide un
    contador ''Variantes: N / 100'' con limite visual 100. (b) D8 superseded by D277: el borrado es incondicional, sin chequeo
    de uso ni dialogo, porque el producto copia el texto y no referencia el id; el ticket pide advertencia al editar o eliminar.
    Las dos se cierran actualizando el ticket, sin tocar codigo, si producto ratifica lo decidido.'
  - 'OBS-2 (CONTRADICCION VIVA DENTRO DEL TICKET): el gherkin del AC2 dice que las variantes globales quedan disponibles
    ''as defaults'' y la actualizacion del 2026-07-27 del mismo ticket dice que la biblioteca NO se auto-instancia como
    set por defecto. La implementacion sigue la segunda lectura. Hay que corregir el texto del AC2 para que no queden las
    dos versiones conviviendo.'
  - 'OBS-3 (VENTANA DE DEPLOY, no la ve ningun test): la migracion 1717200000000-AddVariantLibrary.ts no solo crea las dos
    tablas nuevas; tambien crea DOS indices sobre tablas EXISTENTES: idx_product_options_tenant_name sobre product_options
    y idx_product_option_values_tenant_value sobre product_option_values. Son CREATE INDEX simple, NO CONCURRENTLY, y una
    migracion de TypeORM corre dentro de una transaccion (CONCURRENTLY no puede), asi que es un tradeoff conocido y no un
    descuido. Efecto: durante el deploy toma un lock ACCESS EXCLUSIVE sobre esas dos tablas mientras construye el indice,
    o sea una pausa de lectura/escritura en el catalogo de opciones de producto proporcional al tamano de esas tablas en
    el tenant mas grande. Los Testcontainers arrancan con tablas vacias, asi que ningun test lo revela. En staging la migracion
    ya corrio.'
  - 'OBS-4 (positiva): la guarda que SI quedo viva en el borrado es D6 -una categoria con valores hijos rechaza el borrado
    con 409 y el mensaje ''This category still has values - delete them first, then try again.''- y esta reforzada a nivel
    de base con FK ON DELETE RESTRICT, con un test que la prueba salteando el chequeo del use case. Cerro una carrera TOCTOU
    real que la ronda 1 de review habia encontrado: antes, con ON DELETE CASCADE, una insercion concurrente de opcion sobrevivia
    al borrado del tipo.'
  - 'OBS-5 (positiva): el dev escribio validaciones que el ticket no pedia -no vacio, trim, tope de 80 caracteres, duplicado
    case-insensitive tenant-wide en categoria y por-categoria en opcion- y mapeo la violacion de unicidad de Postgres (23505)
    a un 409 incluso en carrera concurrente, donde antes se escapaba a un 500 crudo.'
  - 'OBS-6 (DOCUMENTACION, hallazgo 3): dentro de la MISMA PR #1390 conviven dos versiones de la regla de borrado. El codigo
    aplica D277 (borrado incondicional, solo D6 bloquea), pero su propio spec.md sigue declarando el requerimiento ''Delete
    or Deactivate-Only Based on Usage'' con el escenario ''Archived-only reference still blocks deletion'', que el codigo
    actual no cumple ni debe cumplir. La enmienda se registro en design.md y no se propago al spec.md. El frontend si lo
    corrigio en el suyo. Riesgo: que el proximo que lea ese spec.md reimplemente la puerta de uso que el owner descarto
    - exactamente el error que la PR del frontend documenta haber detectado una vez.'
  - 'OBS-7 (HERRAMIENTA): se confirma otra vez que ~/Downloads/_clones/VeevartFrontend no sirve para leer estado de ramas
    (refs remote-tracking congelados) y se agrega el caso hermano: ~/Downloads/VeevartBackend esta en un commit del 2026-08-04
    y NO contiene el modulo variant-library. Buscar ahi la funcionalidad y concluir que no existe habria sido un diagnostico
    falso. El estado real se lee con gh pr diff y gh api.'
  - 'OBS-9 (LLAVE DE LA CORRIDA): esta corrida se escribio primero como TR-044 y se movio a TR-045. Al momento de escribirla
    habia una corrida PARALELA de SH-1097 (TC-51 / TC-52 / TC-53) generando attachments/tr-044-sh-1097 en los mismos minutos.
