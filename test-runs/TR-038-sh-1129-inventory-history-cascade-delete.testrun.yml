    notes: "BLOCKED, no not-run: se intento ejecutar y NO se puede en este tipo de org. Correccion de lo que yo mismo habia anotado antes en este run, que decia que no se corria por decision de alcance para no escribir datos en un sandbox compartido. Esa razon era secundaria y, sobre todo, no era la verdadera. La razon real es que Auctifera.InventoryHistoryBatch esta declarada 'public', no 'global', asi que el paquete gestionado no la expone a orgs suscriptores: el intento de invocarla falla al compilar con 'Type is not visible'. InventoryHistoryScheduler es igual de inaccesible y no hay job programado que lo dispare. CONSECUENCIA PARA EL TEST CASE, que vale mas que este run puntual: el Scenario 4, tal como esta redactado ('when InventoryHistoryBatch runs again'), NO es ejecutable en NINGUN org suscriptor — ni UAT ni produccion — sino unicamente donde esta desplegado el codigo fuente del paquete (org de desarrollo del paquete o scratch org), que es exactamente donde TR-034 lo valido. Conviene anotarlo en TC-69 como escenario solo-scratch-org, o reformularlo en terminos observables desde un suscriptor. Contexto: este escenario cubre el cambio de dedup-key de InventoryHistoryBatch.cls (ahora por Shop Item + Item Variant + Location, ya no por el ahora-nullable Item_per_location__c), que es el fix de SH-1142 viajando en el mismo PR #2541; es regresion, no reemplaza el QA propio de SH-1142. La cobertura vigente sigue siendo el passed de TR-034, con la salvedad de que el passed de TR-034 en el Scenario 6 resulto incorrecto al contrastarlo contra un org real, asi que su evidencia por unit test tampoco deberia leerse como garantia de comportamiento en un suscriptor."
