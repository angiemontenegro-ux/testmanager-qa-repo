    reason: "Scenario 3 EJECUTADO y PASS, pasa de not-run a passed (3/6 -> 4/6). Ya no queda solo la evidencia de metadata: se probo corriendo, bajo System.runAs con un usuario de perfil 'Standard User' al que se le asigno el permset Veevart y la licencia de paquete Auctifera. El insert de Inventory_History__c en AccessLevel.USER_MODE tuvo exito y el lookup Item_per_location__c quedo escrito y legible; ademas sobrevive a Security.stripInaccessible(CREATABLE), que es la comprobacion de FLS aislada de sharing. Se desplego a UAT una clase de test temporal (SH1129FlsProbeTest) porque System.runAs solo existe en contexto de test y en UAT no hay ningun usuario no-admin con el permset; la clase fue eliminada del org al terminar y se verifico que no queda (0 filas en ApexClass). Dos falsos negativos descartados en el proceso, documentados en las notas del escenario: sharing de registro sobre los padres creados por el admin, y un bind de expresion no soportado en SOQL dinamico. Siguen not-run los Scenarios 4 (dedup del batch) y 6 (layout en Lightning)."
  - action: updated
    timestamp: "2026-08-13T16:15:00.000Z"
    user: claude
    reason: "Scenario 6 EJECUTADO y FALLA. Primer hallazgo real de este run: el layout de Inventory History en UAT sigue marcando Auctifera__Item_per_location__c como Required, mientras que el repo en origin/main ya lo tiene como Edit. Confirmado por metadata (layout desplegado vs repo) y visualmente en Lightning, donde el campo aparece con asterisco rojo estando vacio, bloqueando el guardado. Causa raiz: los page layouts de un paquete gestionado no se actualizan en orgs suscriptores existentes — el layout de UAT tiene ManageableState=installed y no se modifica desde 2025-09-23, mientras que el cambio de campo del mismo PR si llego (nillable=true), lo que descarta un build viejo. Afecta a todo org suscriptor existente, incluido Eiteljorg. El run pasa de 4/6 con 2 not-run a 4 passed / 1 failed / 1 not-run. Queda not-run solo el Scenario 4 (dedup del batch). Pendiente decidir con el equipo si se abre defecto propio para el layout."
  - action: updated
    timestamp: "2026-08-14T14:00:00.000Z"
    user: claude
    reason: "Correccion de numeracion y de dos afirmaciones incorrectas, detectadas al revisar el historial del repo antes de registrar el defecto. (1) RENUMERADO de TR-037 a TR-038: mientras este run estaba en curso se mergeo a main TR-037 para SH-1174 (commits ab761d0..c7e8589, 2026-08-14), asi que la clave colisionaba. El run hermano de SH-1169 paso de TR-038 a TR-039 y el contador testRun subio a 39. Se habia elegido TR-037 mirando solo origin/main en el momento de ramificar; la leccion es verificar la numeracion contra main ACTUALIZADO justo antes de publicar, no al empezar. (2) Se retiro la afirmacion de que este era 'la primera ejecucion de TC-69': TR-034 ya lo habia ejecutado (5 passed, 1 not-run). Lo correcto es que este es el primer run contra un org SUSCRIPTOR. (3) El Scenario 4 deja de presentarse como hueco de cobertura: TR-034 ya lo tenia en passed. (4) Registrado el defecto SH-1201 contra el Scenario 6, con el detalle de que este FAIL contradice el passed de TR-034, que se habia validado leyendo el XML del repo en vez del org desplegado."
  - action: updated
    timestamp: "2026-08-14T14:45:00.000Z"
    user: claude
    reason: "Scenario 4 intentado y marcado BLOCKED, con lo cual ya no queda ningun escenario sin atender: 4 passed / 1 failed / 1 blocked. Se corrige ademas la razon que yo mismo habia dado antes. No es que se haya evitado correr el batch por prudencia en un sandbox compartido: es que Auctifera.InventoryHistoryBatch esta declarada 'public' y no 'global', asi que el paquete gestionado no la expone a orgs suscriptores y el intento de invocarla falla al compilar con 'Type is not visible'. El scheduler es igual de inaccesible y no hay ningun job programado que lo dispare, de ahi que UAT tenga 0 filas de Inventory_History__c. Implicacion para TC-69: el Scenario 4 no es ejecutable en NINGUN org suscriptor, solo donde esta el codigo fuente del paquete; conviene anotarlo como escenario solo-scratch-org o reformularlo."
  - action: updated
    timestamp: "2026-08-18T15:10:00.000Z"
    user: claude
    reason: "SEGUNDA CORRIDA contra un build distinto. UAT subio de Auctifera 8.332.0.2 a 8.336.0.2, asi que la validacion original ya no describia el build instalado. Se re-ejecutaron los tres scripts de los Scenarios 1, 2 y 5: PASS los tres, cero excepciones, resultados identicos a la primera corrida. Logs nuevos en attachments/SH-1129/TR-38/rerun-8.336.0.2/. El Scenario 6 se re-verifico y SIGUE FALLANDO: el layout desplegado mantiene Item_per_location__c = Required mientras origin/main tiene Edit, o sea llego otro upgrade del paquete y tampoco arrastro el cambio de layout — confirmacion empirica del diagnostico de SH-1201, comentado alli. Los Scenarios 3 y 4 no se re-ejecutaron: el 3 requeriria desplegar de nuevo la clase de test temporal y su resultado no depende del build, y el 4 sigue siendo imposible en un org suscriptor por la misma razon estructural. Los conteos del summary no cambian: 4 passed / 1 failed / 1 blocked."
