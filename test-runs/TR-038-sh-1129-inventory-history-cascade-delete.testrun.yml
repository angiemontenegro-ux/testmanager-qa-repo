            path: attachments/SH-1129/TR-38/rerun-8.336.0.2/uat-deployed-layout-8.336.0.2.xml
            mimeType: text/xml
    notes: "FAIL con causa raiz identificada, y NO es que el fix este mal: es que los page layouts de un paquete gestionado no se actualizan en orgs suscriptores ya existentes. Evidencia: el layout de UAT tiene ManageableState=installed, fue creado el 2025-09-23 y su LastModifiedDate es 2025-09-23T13:37:50Z — nunca se toco desde la instalacion, casi un año antes de que se mergeara PR #2541 (2026-07-30). Nadie lo personalizo localmente. En cambio el cambio de CAMPO del MISMO PR si llego (Item_per_location__c describe nillable=true en UAT), lo que descarta que el build instalado sea anterior al fix. O sea: el paquete subio, el campo se actualizo, el layout no. IMPACTO: el fix hace que el lookup quede legitimamente vacio tras borrar un IPL, pero cualquier usuario que abra ese registro en Lightning y trate de guardarlo queda bloqueado por el Required del layout. Esto aplica a TODO org suscriptor existente, no solo UAT — incluido Eiteljorg, que es donde nacio el incidente de SH-1115 y donde justamente hubo que manipular estos registros a mano. El Required del layout es una restriccion solo de UI: la insercion por API con el lookup nulo funciona, por eso los Scenarios 1, 2, 3 y 5 pasan y este falla. CONTRADICE A TR-034, que habia marcado este mismo escenario como passed. La nota de TR-034 lo dice explicitamente: se valido 'por metadata declarativa (source-of-truth XML)' asumiendo que es 'un atributo simple sin logica intermedia que pudiera diferir de lo desplegado'. Esa suposicion es justamente la que falla aqui: el XML del repo dice Edit, el org desplegado dice Required. Es el argumento de por que vale ejecutar contra un org suscriptor real y no leer el repo. Defecto abierto: SH-1201. REMEDIACION propuesta ahi: actualizar el layout manualmente por org, o incluirlo en un post-install/upgrade step. CONFIRMADO EN UN SEGUNDO BUILD (2026-08-18): UAT paso de 8.332.0.2 a 8.336.0.2 y el layout SIGUE en Required. Llego otro upgrade del paquete y tampoco arrastro el cambio, que es confirmacion empirica del diagnostico y no solo teoria. Implicacion practica: esto no se resuelve esperando releases, ningun numero de upgrades lo va a entregar. Comentado en SH-1201."
