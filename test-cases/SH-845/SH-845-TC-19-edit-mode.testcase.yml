schemaVersion: "1.0"
id: "12216d87-50b2-4be7-90f3-023216e114cf"
key: "TC-19"
title: "Discount Wizard — edit mode (header, save, overflow, legacy)"
description: |
  Edit mode: persistent sticky header + top-right Save on every step, Draft vs Active validation
  against the SH-844 engine, the overflow menu (Archive/Duplicate) and status quick-toggle, and
  the read-only legacy fixed-amount promotion banner.
type: "functional"
priority: "medium"
status: "active"
format: "gherkin"
preconditions:
  - "The admin has permission to manage discounts in the Shop admin panel (Discounts -> Discount Codes)."
  - "The Discount Authoring Wizard build from SH-845 is deployed to the target environment."
  - "The paired SH-844 Discounts Engine (create/update/validation) is available in the same environment."
  - "At least one Event with ticket types exists so Ticketing rules can be configured."
  - "At least one existing percent Discount Code exists for edit-mode scenarios."
  - "At least one legacy fixed-amount promotion exists for the legacy read-only scenario."
  - "Testing is performed on desktop and tablet using the brand-orange admin design system."
scenarios:
  - title: "Edit mode persistent header, top-right Save on every step, and sticky behavior"
    tags:
      - "happy-path"
      - "edit-mode"
      - "header"
    given:
      - "the admin opens an existing percent Discount Code from the list"
    when:
      - "the wizard loads in EDIT mode and the admin scrolls a long step"
    then:
      - "the wizard opens at Step 1 with all fields populated from the persisted record and Steps 1-3 badges show green checkmarks when their data is valid"
      - "the persistent header shows, top to bottom: breadcrumb (Back > Discounts > Discount Codes), title row (name + status pill + top-right Save + ... overflow), metadata strip (kind badge + key date + status quick-toggle), and the stepper"
      - "the top-right Save is visible on Steps 1-4, enabled when completed fields are valid for the target status, disabled with an explanatory tooltip otherwise"
      - "on scroll the breadcrumb collapses out of view while the title row, metadata strip, and stepper stay sticky and Save stays reachable"
      - "NONE of the status pill, top Save, metadata strip, or overflow menu render in CREATE mode"
  - title: "Edit mode Save persists in place with Draft vs Active validation"
    tags:
      - "edit-mode"
      - "integration"
      - "sh-844-dependency"
      - "edge-case"
    given:
      - "the admin is editing an existing discount on any step"
    when:
      - "the admin clicks the top-right Save button under different target statuses"
    then:
      - "the system calls the engine update endpoint with the current state, keeps the admin on the current step, shows the toast Discount saved, and updates the header status pill"
      - "with Status = Draft required-field validation is relaxed (only fields filled so far are validated)"
      - "setting Status = Active via the header quick-toggle and saving validates the full payload against the SH-844 Active rules"
      - "on validation error an error banner with the message and a Go to <step> link is shown and the record is NOT persisted as Active until all required fields are valid"
  - title: "Edit mode overflow menu and status quick-toggle"
    tags:
      - "edit-mode"
      - "confirmation"
    given:
      - "the admin is on the wizard for an existing discount in EDIT mode"
    when:
      - "the admin uses the ... overflow menu and the metadata-strip status quick-toggle"
    then:
      - "the overflow menu shows Archive and Duplicate"
      - "Archive opens the confirmation Archive this discount? It will no longer be available for new redemptions."
      - "Duplicate creates a draft copy with the same field values and navigates to its Step 1 in CREATE mode"
      - "the status quick-toggle reflects the current status and changes the intended state, but only persists when the admin clicks the header Save"
  - title: "Editing a legacy fixed-amount promotion is read-only"
    tags:
      - "edge-case"
      - "edit-mode"
      - "legacy"
      - "regression"
    given:
      - "the admin opens an existing legacy fixed-amount promotion"
    when:
      - "the wizard loads at Step 1"
    then:
      - "a non-dismissible banner reads Legacy fixed-amount discount. Editing is handled by the migration workstream."
      - "all fields are read-only in this wizard"
      - "the persistent edit-mode header still renders but the top-right Save is disabled with tooltip Editing handled by migration workstream"
