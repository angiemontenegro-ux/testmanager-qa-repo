schemaVersion: "1.0"
id: "f3a2b1c0-d4e5-4f60-a7b8-9c0d1e2f3a4b"
key: "TC-12"
title: "Kiosk Admin secure access via Salesforce signed link"
description: "QA coverage for SH-810: validates that the Kiosk Admin panel requires a short-lived Salesforce-signed JWT to grant access, rejects expired/tampered/missing tokens, enforces session-based protection across all /admin/* routes, and resists known JWT attacks."
type: "functional"
priority: "high"
status: "active"
format: "gherkin"
preconditions:
  - "QA user has Veevart Settings permission in Salesforce and can access the Kiosk Mode > Settings page."
  - "The URL to Kiosk Admin Page field is set to https://admin.kiosk.dev.veev.veevartapp.com/."
  - "The shared signing secret is configured in both the Salesforce Custom Setting and the kiosk backend environment."
  - "The kiosk backend audit log is accessible for verification."
scenarios:
  - title: "Valid signed token is generated with correct claims when clicking Open Kiosk Admin"
    tags:
      - "happy-path"
      - "token-generation"
    given:
      - "the QA user is logged into Salesforce with Veevart Settings permission"
      - "the Kiosk Mode > Settings page is open showing the configured Kiosk Admin URL"
    when:
      - "the user clicks the Open Kiosk Admin button"
    then:
      - "the browser is redirected to the configured KioskAdminURL with a token query parameter"
      - "the JWT payload contains an orgId claim equal to UserInfo.getOrganizationId()"
      - "the difference between exp and iat in the JWT is at most 300 seconds"
      - "no plain orgId query parameter appears outside the JWT payload"

  - title: "Backend accepts valid non-expired token, creates session, and records audit entry"
    tags:
      - "happy-path"
      - "session"
      - "audit"
    given:
      - "a signed token was just generated by clicking Open Kiosk Admin (within the 5-minute TTL)"
    when:
      - "the browser lands on /admin?token=<valid_token>"
    then:
      - "the response is HTTP 200"
      - "a session cookie is issued by the backend"
      - "the user is redirected to the Kiosk Admin dashboard without being shown a login screen"
      - "an audit log entry is created containing the Salesforce user ID, timestamp, and source IP"
      - "subsequent requests to /admin/* routes succeed using the session cookie without re-authentication"

  - title: "Expired token is rejected with a clear expiry message"
    tags:
      - "negative"
      - "token-expiry"
    given:
      - "a previously valid signed token whose exp timestamp is in the past (more than 5 minutes elapsed)"
    when:
      - "the browser navigates to /admin?token=<expired_token>"
    then:
      - "the response is HTTP 401"
      - "the page displays a message indicating the link has expired and instructs the user to open from Salesforce again"
      - "no session cookie is issued"

  - title: "Tampered token (modified signature or payload) is rejected and failure is logged"
    tags:
      - "negative"
      - "security"
      - "tampered-token"
    given:
      - "a valid signed token is obtained"
    when:
      - "the token signature segment is altered, or the payload is decoded, a claim is changed, and the token is re-submitted with the original signature"
      - "the modified token is sent to /admin?token=<tampered_token>"
    then:
      - "the response is HTTP 401 in both cases"
      - "no session cookie is issued"
      - "the failure is recorded in the audit log with the source IP and reason"

  - title: "Direct access to any /admin route without token or session is denied"
    tags:
      - "negative"
      - "unauthorized-access"
    given:
      - "the browser has no active session cookie and no token"
    when:
      - "the user navigates directly to /admin, /admin/locations, or any other /admin/* route"
    then:
      - "every request returns HTTP 401"
      - "no dashboard content or sensitive admin data is rendered"

  - title: "Plain orgId param, empty token, and malformed token are all rejected"
    tags:
      - "negative"
      - "input-validation"
    given:
      - "no active session cookie exists"
    when:
      - "a request is made to /admin?orgId=<valid_org_id> with no token"
      - "a request is made to /admin?token= with an empty value"
      - "a request is made to /admin?token=abc123notajwt with a non-JWT string"
    then:
      - "all three requests return HTTP 401"
      - "the backend ignores the plain orgId query parameter and does not grant a session"
      - "no stack trace or internal error detail is exposed in the response"

  - title: "alg:none attack and unsigned JWT are rejected outright"
    tags:
      - "security"
      - "jwt-attack"
    given:
      - "a JWT is crafted with alg set to none in the header and a valid-looking payload, submitted without a signature"
    when:
      - "the crafted token is sent to /admin?token=<alg_none_token>"
    then:
      - "the response is HTTP 401"
      - "the backend rejects the token without evaluating the payload claims"

  - title: "JWT with invalid issuer or audience is rejected"
    tags:
      - "security"
      - "jwt-claims"
    given:
      - "a JWT is signed with the correct secret but has an incorrect iss or aud value in the payload"
    when:
      - "the token is submitted to /admin?token=<invalid_claims_token>"
    then:
      - "the response is HTTP 401"
      - "the backend rejects the token based on issuer or audience mismatch before granting access"

  - title: "Salesforce user without Veevart Settings permission cannot generate a signed token"
    tags:
      - "security"
      - "authorization"
    given:
      - "a Salesforce user who does not have the Veevart Settings permission set is logged in"
    when:
      - "the user attempts to invoke the Apex endpoint that generates the signed token"
    then:
      - "Salesforce denies access to the endpoint"
      - "no JWT is generated"
      - "no redirect to the Kiosk Admin URL occurs"
