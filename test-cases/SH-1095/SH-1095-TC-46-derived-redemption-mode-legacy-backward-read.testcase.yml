key: "TC-46"
title: "Derived Redemption Mode & Legacy Backward-Read"
description: "PARTIALLY RETIRED 2026-08-11 — see the retirement record below. What remains: legacy backward-read tolerance, plus the still-open PE3 conflict over which redemption path wins when a Rule carries membershipProgramId AND a customer_facing_code is set. Product (Martin Campo, Slack, 2026-07-27) said Automatic wins; the independent 'Taller de decisiones' architecture workshop (decision D3, later the same day) recommends the opposite (codigo gana) to avoid silent dead rule configuration. QA does not pick a side (SH-1125 Pending Decisions #2).

RETIREMENT RECORD — retired against discount-engine-v3 test-catalogue-v3.md section 6.1 'Retire and replace'. Two scenarios were removed because they certify a PROMOTION-LEVEL derived redemption mode, which decision D2 replaces with per-rule derivation (a sibling trigger-less rule stays CODE_REQUIRED, so a promotion-level scalar cannot express the model):
  - REMOVED 'A rule with membershipProgramId derives AUTOMATIC mode' — successor DER-01.
  - REMOVED 'No rule with membershipProgramId derives CODE_REQUIRED and requires a customer-facing code' — successors BUS-01 (checkout), DER-02 (authoring), BUS-19 (Shop/R5), R2A-07. Retired citing CCR consequence 2: CUSTOMER_FACING_CODE_REQUIRED_FOR_CODE_MODE is one of three SH-1095 error codes that must never be built. (Note: the earlier Q2A justification lapsed under I15 — the retirement stands on CCR, not on Q2A.)

NOT RETIRED, AND WHY:
  - The PE3 scenario is HELD, not retired. Section 6.1 routes it to DER-18, but DER-18 is itself blocked_by PE3, so retiring now would trade a compliant two-armed record for no coverage at all. It also already satisfies the catalogue's own rule ('a blocked case states its expected result for both candidate answers, do not pick one') — the catalogue reviewed the older SH-1119 revision that had picked a side; this file was already corrected on 2026-07-28. Retire only once PE3 closes and DER-18 unblocks.
  - Section 6.1 also retires a 'the derived mode flips from AUTOMATIC to CODE_REQUIRED' scenario (its sc.8, successor DER-15). NO SUCH SCENARIO EXISTS IN THIS FILE — nothing to remove. The catalogue's scenario numbers are offset from this file throughout (it cites sc.2/sc.3/sc.7/sc.8 against a 5-scenario file) because it reviewed the SH-1119 revision. Match by assertion text, never by scenario number.

BLOCKER ON EVERYTHING THAT REMAINS — verified against VeevartBackend origin/main @ 5032509c (2026-08-04): redemptionMode, redemption_mode, derivedRedemptionMode, derivedTrigger and derivedDateTimeSource have ZERO occurrences repo-wide (src, tests, migrations, JSON). Promotion.kind and the PromotionKind value object are still the live model, still guarded, and still carry the SH-992/993/994 Shop conformance rules. The contract this case asserts is not present on the shipped trunk, so no scenario here is executable today. Caveat: both local clones fetch only refs/heads/main, so an unmerged feature/discount-engine-v3-SH-1094 branch could not be inspected from here — confirm before concluding the work does not exist. Status moved to draft for that reason. The catalogue's policy prefers a 'blocked' status over 'draft'; this repo has no 'blocked' value in use, so draft is a deliberate tooling-safe placeholder pending that call."
type: "functional"
