schemaVersion: "1.0"
id: "eecc9911-2077-4987-a8e5-07412e5ae279"
key: "TC-63"
title: "Shop Rule Card — Category, Item Scope & Item Type"
description: "QA coverage for SH-1097's Shop rule card: validates Qualifying Item Type against the confirmed prototype (a 3-option select, not the free-text field described in the story's written AC — corrected twice against the real prototype), validates the confirmed Category-to-Item cascade behavior on scope selection, and confirms Minimum/Max Quantity were intentionally cut by Product on 2026-07-22."
type: "functional"
priority: "high"
status: "active"
format: "gherkin"
preconditions:
  - "The Ticketing & Shop rule cards (SH-1097) are deployed to the QA/staging environment."
  - "At least one Shop category with items assigned exists."
scenarios:
  - title: "Qualifying Item Type is a fixed-option select, not free text"
    tags:
      - "happy-path"
      - "corrected-from-prototype"
    given:
      - "the admin is on a Shop rule card"
    when:
      - "the admin views the Qualifying Item Type field"
    then:
      - "exactly 3 options are offered: Any qualifying item / Same item only / Same category only"
      - "this corrects SH-1097's written AC, which describes the field as free text — the real prototype confirms a select"

  - title: "Item selection cascades from Category scope, with an inline warning on narrowing"
    tags:
      - "happy-path"
      - "confirmed-behavior"
      - "cascade"
    given:
      - "each Shop rule scopes by Category and Item, not by an 'All items in categories' vs 'Specific items' toggle"
      - "the admin has selected one or more Categories and then picked specific Items in the Item selector"
    when:
      - "the admin views the Item selector"
    then:
      - "the Item selector only offers items belonging to the currently selected Categories"

  - title: "Narrowing Categories after picking Items shows an inline warning listing removed items"
    tags:
      - "edge-case"
      - "confirmed-behavior"
      - "cascade"
    given:
      - "the admin has already selected specific Items scoped to certain Categories"
    when:
      - "the admin removes one or more of those Categories, narrowing the Category scope"
    then:
      - "an inline warning appears listing the specific Items that were removed as a result"

  - title: "Minimum Quantity and Max Quantity fields are removed"
    tags:
      - "modified-scope-cut"
    given:
      - "Product cut Minimum Quantity and Max Quantity from the Shop rule card on 2026-07-22, confirmed against the prototype"
    when:
      - "the admin views the Shop rule card"
    then:
      - "neither Minimum Quantity nor Max Quantity fields are rendered"
      - "no replacement scenario is needed for these fields"
tags:
  - "sh-1097"
  - "discount-wizard"
  - "rule-card"
  - "shop"
