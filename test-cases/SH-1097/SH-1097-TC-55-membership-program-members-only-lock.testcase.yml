schemaVersion: "1.0"
id: "9d21fd58-0010-4845-9067-3ef18c20d4f6"
key: "TC-55"
title: "Membership Program ↔ Members Only Reactive Lock"
description: "QA coverage for SH-1097: validates that setting a Membership Program on a rule forces Members Only to ON and locks it, and that clearing the Membership Program returns Members Only to a user-editable, default-OFF state."
type: "functional"
priority: "medium"
status: "active"
format: "gherkin"
preconditions:
  - "The Ticketing & Shop rule cards (SH-1097) are deployed to the QA/staging environment."
  - "At least one active Membership Program exists."
scenarios:
  - title: "Setting Membership Program locks Members Only to ON"
    tags:
      - "happy-path"
    given:
      - "a rule has no Membership Program set and Members Only is OFF"
    when:
      - "the admin sets Membership Program to a valid program"
    then:
      - "Members Only switches to ON and becomes disabled/locked"
      - "a tooltip reads 'Members Only is required when the rule targets a Membership Program.'"

  - title: "Clearing Membership Program unlocks Members Only"
    tags:
      - "edge-case"
    given:
      - "a rule has Membership Program set and Members Only locked ON"
    when:
      - "the admin clears the Membership Program field"
    then:
      - "Members Only becomes user-editable again"
      - "its value defaults back to OFF"

  - title: "Members Only cannot be manually turned off while a Membership Program is set"
    tags:
      - "negative"
    given:
      - "a rule has Membership Program set and Members Only locked ON"
    when:
      - "the admin attempts to toggle Members Only off without clearing Membership Program"
    then:
      - "the toggle remains ON and the control stays disabled"
tags:
  - "sh-1097"
  - "discount-wizard"
  - "rule-card"
  - "membership-program"
