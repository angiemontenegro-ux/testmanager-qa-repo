schemaVersion: "1.0"
id: "461f9f5d-088d-49e4-ba3f-79a71695d6f5"
key: "TC-51"
title: "Per-Rule Active Window — 'When does the discount apply?' Options & Derivation"
description: "QA coverage for SH-1097: validates the per-rule ACTIVE WINDOW as Fix 19 actually shipped it — an explicit 'When does the discount apply?' segmented control whose option list is computed from the rule's shape, NOT the auto-hide-plus-banner model this test case originally described. REWRITTEN 2026-09-03 after TR-044: scenarios 1, 2, 5 and 6 asserted the pre-Fix-19 design and produced false FAILs. Scenario 5 in particular asserted that custom dates are CLEARED when an event or membership is picked later — that is the defect the team fixed, and the shipped invariant is preservation, so it has been inverted. Scenario 4 (the intersection banner) is deliberately LEFT UNCHANGED: it reports a real product gap awaiting a Product decision and must keep failing until that is resolved."
type: "functional"
priority: "medium"
status: "active"
format: "gherkin"
preconditions:
  - "The Ticketing & Shop rule cards (SH-1097) are deployed to the environment under test."
  - "At least one Event/Program with a defined schedule and one active Membership Program exist."
  - "Step 1 has Apply to = Specific items, which is the only state that renders the rule cards."
scenarios:
  - title: "An all-programs rule defaults to No date restriction, and Specific date range reveals the editable block"
    tags:
      - "happy-path"
      - "fix-19"
    given:
      - "a Ticketing rule has Program / Events = All Ticketing Programs and no Membership Program set"
    when:
      - "the rule card renders and the admin reads the 'When does the discount apply?' control"
    then:
      - "exactly two options are offered: 'No date restriction' and 'Specific date range'"
      - "'No date restriction' is preselected, and no Date & Time Range block is rendered yet"
      - "its helper text reads 'Active for as long as the discount is.'"
      - "choosing 'Specific date range' reveals the Date & Time Range block with its start/end, days-of-week, time window and additive extra-date inputs, all editable"

  - title: "A concrete programme offers the two event-scoped options, defaulting to the programme's own schedule"
    tags:
      - "happy-path"
      - "derived-dates"
      - "fix-19"
    given:
      - "the admin selects one specific Program / Events value on a Ticketing rule (not the All Programs sentinel) and sets no Membership Program"
    when:
      - "the rule card re-renders and the admin reads the 'When does the discount apply?' control"
    then:
      - "exactly two options are offered: 'Full program schedule' and 'Specific range within program'"
      - "'Full program schedule' is preselected and renders no Date & Time Range block"
      - "its helper text reads 'Active exactly while the program runs.'"
      - "choosing 'Specific range within program' reveals the Date & Time Range block, with helper 'Pick a shorter window inside the program's own dates.'"

  - title: "Active window is replaced by the inheritance banner when a Membership Program is set"
    tags:
      - "happy-path"
      - "derived-dates"
      - "fix-13"
    given:
      - "the admin sets Membership Program = Gold Circle on a rule (Ticketing or Shop)"
    when:
      - "the rule card re-renders"
    then:
      - "the whole ACTIVE WINDOW section is absent, not disabled, and the 'When does the discount apply?' control offers no options at all"
      - "an info banner takes its place and names the programme: 'Dates are inherited from the Gold Circle membership.'"
      - "when the programme name cannot be resolved the banner degrades to 'Dates are inherited from the membership.' with no double space"

  - title: "Event and Membership Program together show the intersection banner"
    tags:
      - "edge-case"
      - "derived-dates"
      - "known-gap"
    given:
      - "a Ticketing rule has Program / Events = Summer Exhibit AND Membership Program = Gold"
      - "NOTE: this scenario is a KNOWN PRODUCT GAP, not test-case drift. TR-044 confirmed no intersection banner exists anywhere in the module and that the membership gate takes precedence outright. It is deliberately left asserting the designed behaviour so it keeps failing until Product decides whether to build the banner or retire the requirement. Do NOT rewrite this to match the code."
    when:
      - "the rule card renders"
    then:
      - "the Date & Time Range block is hidden"
      - "the info banner reads 'Dates are inherited from the intersection of the selected event(s) and Membership Program.'"

  - title: "Custom dates already authored on a rule SURVIVE a later Membership Program gate and its save"
    tags:
      - "edge-case"
      - "regression-guard"
      - "data-preservation"
    given:
      - "the admin had authored custom Date & Time Range values on a rule and saved it"
      - "NOTE: this scenario was INVERTED on 2026-09-03. It previously asserted the values are CLEARED, which is the defect the team fixed — a card that deleted every gated rule's schedule on save, a permanent delete with no error anywhere. Preservation is the shipped invariant and is guarded by a dedicated test file that drives the real card rather than hand-building the emission."
    when:
      - "the admin then sets a Membership Program on that rule and saves a change to an unrelated field"
    then:
      - "the ACTIVE WINDOW section is hidden behind the inheritance banner, with no warning about clearing anything"
      - "the previously stored date window is still intact after the save, not nulled out of the payload"
      - "clearing the Membership Program again brings the same stored window back on screen unchanged"

  - title: "A Shop rule offers the two-option window control, defaulting to No date restriction"
    tags:
      - "happy-path"
      - "shop"
      - "fix-19"
    given:
      - "a Shop rule has Category and Item set and no Membership Program"
    when:
      - "the rule card renders and the admin reads the 'When does the discount apply?' control"
    then:
      - "exactly two options are offered: 'No date restriction' and 'Specific date range' — Shop has no event-derived option"
      - "'No date restriction' is preselected once the scope is complete, so no Date & Time Range block is rendered yet"
      - "choosing 'Specific date range' reveals the editable Date & Time Range block"
