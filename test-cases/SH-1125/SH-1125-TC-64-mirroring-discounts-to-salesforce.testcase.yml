title: "Mirroring Discounts to Salesforce for POS — Smoke Coverage"
description: "QA coverage for the JTBD 'Mirroring Discounts to Salesforce for POS' (SH-1125). No dedicated Jira story exists yet for this JTBD — this is a real gap flagged directly from the JTBD description, drafted ahead of a spec (shift-left). Flags archive/delete mirror behavior and sync timing as unspecified."
type: "functional"
priority: "high"
