preconditions:
  - "No Jira story exists yet for this JTBD; scenarios are smoke-level and drafted directly from the JTBD description in SH-1125."
  - "POS Mobile has visibility into the legacy Salesforce discount object that this mirror targets."
scenarios:
  - title: "Creating a discount produces a mirrored Salesforce record"
    tags:
      - "happy-path"
    given:
      - "an admin creates an Active discount in the Discount Engine"
    when:
      - "the mirror process runs"
    then:
      - "a corresponding record is created in the legacy Salesforce object, visible to POS Mobile"

  - title: "Archive/delete mirror behavior and sync timing are unspecified"
    tags:
      - "needs-clarification"
    then:
      - "OPEN QUESTIONS — no spec states whether the mirror is removed on archive/delete, nor the sync timing (sync vs async); this test case stays in draft until a story exists for this JTBD"
