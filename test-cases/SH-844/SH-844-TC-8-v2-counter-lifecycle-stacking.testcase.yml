schemaVersion: "1.0"
id: "d3754bb7-e8b0-48ba-b04b-705c4e1f7526"
key: "TC-8"
title: "Counter lifecycle & pre-reservation (V2, out of scope) + confirmed V1 additive stacking"
description: "Mixed file. Most scenarios below are sourced from the Notion Gherkin doc and describe an ASPIRATIONAL / V2 design that does NOT match SH-844 (V1) — kept for traceability only, DO NOT run against V1, these will fail by design. Status is draft; activate per-scenario only when the matching V2 story ships. Exception: the additive-stacking scenario is CONFIRMED V1 behavior — Product (Martin Campo) confirmed 2026-07-27 that V1 stacking is live and additive today (the engine emits a STACKED option in discountOptions[] and consumers auto-apply isBest); BR-074 is Closed, per BR-072/073/074/075 and the Validation Pipeline. The remaining counter-lifecycle, applyCustomerCode, and checkCustomerFacingCodeAvailability scenarios are still unconfirmed V2-only content."
type: "functional"
priority: "low"
status: "draft"
format: "gherkin"
preconditions:
  - "Do not execute the remaining V2-only scenarios below against the V1 engine — they document aspirational V2 behavior only."
  - "V1 source of truth is SH-844; on any conflict SH-844 wins, EXCEPT the additive-stacking scenario below, which Product confirmed directly as current V1 behavior on 2026-07-27 and which may be run against V1."
scenarios:
  - title: "Additive stacking of two stackable codes"
    tags:
      - "happy-path"
      - "stacking"
    given:
      - "two stackable codes of 10% and 5% on a $100 ticket line"
    when:
      - "both are applied"
    then:
      - "the engine emits a STACKED option in discountOptions[] with a total discount of $15 additive (not $14.50 compound)"
      - "CONFIRMED V1: Product (Martin Campo) confirmed 2026-07-27 that V1 stacking is additive and live today; consumers auto-apply the isBest option. BR-074 is Closed, per BR-072/073/074/075 and the Validation Pipeline."
  - title: "[V2] confirmDiscountUsage transitions Resolved to Confirmed (idempotent)"
    tags:
      - "v2"
      - "out-of-scope-v1"
      - "counter-lifecycle"
    given:
      - "a discount usage in state Resolved for an order"
    when:
      - "confirmDiscountUsage is called (and called again)"
    then:
      - "the counter moves Resolved -> Confirmed and repeat calls are idempotent"
      - "NOT IN V1: SH-844 has no Resolved/Confirmed pre-reservation lifecycle; current_usage increments on confirmed redemption. V2 only."
  - title: "[V2] reverseDiscountUsage transitions Resolved to Reverted and frees quota (idempotent)"
    tags:
      - "v2"
      - "out-of-scope-v1"
      - "counter-lifecycle"
    given:
      - "a discount usage in state Resolved"
    when:
      - "reverseDiscountUsage is called (and called again)"
    then:
      - "the counter moves Resolved -> Reverted, quota is freed, and repeat calls are idempotent"
      - "NOT IN V1 as framed: SH-844 refunds/voids do NOT decrement current_usage. V2 only."
  - title: "[V2] Counter state machine Available/Resolved/Confirmed/Reverted/Exhausted"
    tags:
      - "v2"
      - "out-of-scope-v1"
      - "counter-lifecycle"
    given:
      - "a new code with overallUsage max=1"
    when:
      - "clients apply, confirm, revert, and exhaust the code"
    then:
      - "the counter walks Available -> Resolved -> Confirmed/Reverted, reaching Exhausted at the max"
      - "NOT IN V1: SH-844 uses a simple current_usage counter. V2 only."
  - title: "[V2] applyCustomerCode pre-reserves a slot before confirmation"
    tags:
      - "v2"
      - "out-of-scope-v1"
      - "api-surface"
    given:
      - "a customer-facing code with remaining quota"
    when:
      - "applyCustomerCode is invoked"
    then:
      - "a slot is pre-reserved (Resolved) and usage errors (ALREADY_USED / USAGE_LIMIT / TICKET_LIMIT) are surfaced"
      - "NOT IN V1: SH-844 exposes POST /discounts/evaluate and /discounts/quote-options, not applyCustomerCode. V2 only."
  - title: "[V2] checkCustomerFacingCodeAvailability is a pure read (no quota consumed)"
    tags:
      - "v2"
      - "out-of-scope-v1"
      - "api-surface"
    given:
      - "a code with overallUsage max=1 and current=0"
    when:
      - "availability is checked repeatedly"
    then:
      - "available=true/false is returned with a reason and no counter is modified"
      - "NOT IN V1: no equivalent endpoint in SH-844. V2 only."
tags:
