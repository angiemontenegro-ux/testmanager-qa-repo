schemaVersion: "1.0"
id: "bfad068f-6dd4-4206-9807-b017a4b5aded"
key: "TC-6"
title: "Discount quote / offer preview"
description: "QA coverage for SH-844 POST /discounts/quote-options: returns ALL eligible promotion offers for a cart. Each option carries the shipped V1 shape { promotionId, customerFacingCode, effectiveDiscountMinorUnits, perItemBreakdown }. The call is synchronous and read-only (never mutates current_usage). V1 has no conditional-offer / applicability_note concept: promotions the buyer is not eligible for are filtered out by the same gates as evaluate, not surfaced as conditional offers."
type: "functional"
priority: "medium"
status: "active"
format: "gherkin"
preconditions:
  - "The Discounts Engine is reachable and quote-options is synchronous and read-only (never mutates current_usage)."
scenarios:
  - title: "Quote returns an option per eligible promotion for the cart"
    tags:
      - "happy-path"
      - "quote"
    given:
      - "a cart, a quote context with channel = ticketing-online, and two Active promotions A and B that both apply to the cart"
    when:
      - "the caller invokes POST /discounts/quote-options"
    then:
      - "the engine returns 200 with { options, requestId } and one option for each of A and B"
      - "each option includes promotionId, customerFacingCode, effectiveDiscountMinorUnits, and perItemBreakdown (the shipped V1 quote_option shape)"
  - title: "Ineligible promotions are excluded from quote-options (no conditional offers in V1)"
    tags:
      - "edge-case"
      - "quote"
    given:
      - "the buyer is not a member and a Membership Benefit promotion M would only apply to active members"
    when:
      - "the caller invokes quote-options for a cart M targets"
    then:
      - "M is filtered out by the members-only gate and does not appear in the options list"
      - "V1 has no conditional-offer / applicability_note concept — the response returns only the surviving eligible offers (an empty list when none are eligible)"
tags:
  - "sh-844"
  - "quote-options"
parameters: []
